name: Site version
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: Validate site version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test version rules
        run: node --test tests/versioning.test.mjs
      - name: Validate against the main revision receiving this batch
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/versioning.mjs check --base "${PR_BASE:-HEAD^1}"
  tag:
    name: Record source version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: site-version-tags
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Tag the exact main commit without moving existing versions
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          git checkout -B main "$EXPECTED_COMMIT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/versioning.mjs tag
